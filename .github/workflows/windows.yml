# Ветки и PR проверяются; установщик собирается только для тега или по ручному запросу.
name: Windows
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'appcast.xml']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'appcast.xml']
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Собрать установщик после проверок'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.38.5'
  CHANNEL: prod
  IS_GITHUB_ACTIONS: 1
  FASTFORGE_VERSION: '0.6.12'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BUILD_INSTALLER: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_installer) }}
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Зависимости и генерация кода
        run: make common-prepare
      - name: Анализ кода (ошибки запрещают сборку)
        run: dart analyze --no-fatal-warnings lib test
      - name: Тесты
        run: flutter test --no-pub
      - name: Инструменты упаковки
        if: env.BUILD_INSTALLER == 'true'
        run: |
          dart pub global activate fastforge $env:FASTFORGE_VERSION
          $cache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          "$cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Ядро приложения
        if: env.BUILD_INSTALLER == 'true'
        run: make windows-libs
      - name: Сборка установщика
        if: env.BUILD_INSTALLER == 'true'
        run: make windows-exe-release
      - name: Проверка файла
        if: env.BUILD_INSTALLER == 'true'
        run: |
          $installers = @(Get-ChildItem dist -Recurse -File -Filter *.exe)
          if ($installers.Count -ne 1) { throw "Ожидался один установщик" }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination out\RescueBoat-Setup-x64.exe
      - uses: actions/upload-artifact@v6
        if: env.BUILD_INSTALLER == 'true'
        with:
          name: windows-installer
          path: out
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: windows-installer
          path: out
      - name: Публикация проверенного установщика
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @()
          if ("${{ github.ref_name }}".Contains('-')) { $extra += '--prerelease' }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $notesPath = "docs/releases/$version.md"
          if (Test-Path -LiteralPath $notesPath) {
            gh release create "${{ github.ref_name }}" out\RescueBoat-Setup-x64.exe --title "${{ github.ref_name }}" --notes-file $notesPath @extra
          } else {
            gh release create "${{ github.ref_name }}" out\RescueBoat-Setup-x64.exe --title "${{ github.ref_name }}" --generate-notes @extra
          }
