# Установщик «Шлюпки спасения» (Inno Setup через fastforge).
# app_id свой: иначе установщик считал бы программу обновлением Hiddify.
app_id: 2F94F809-B249-4505-9114-8027F885C65E
publisher_name: Rescue Boat
publisher_url: https://github.com/aeyota93-cloud/Rescue-boat
display_name: Шлюпка спасения
# Явно: иначе fastforge берёт первый .exe в папке, а это HiddifyCli.exe.
executable_name: RescueBoat.exe
create_desktop_icon: true
# Галочка «Запускать при входе в Windows» включена по умолчанию.
launch_at_startup: true
# Задачи планировщика с правами администратора создаются только из-под администратора.
privileges_required: admin
install_dir_name: "{autopf64}\\RescueBoat"
setup_icon_file: windows\runner\resources\app_icon.ico
locales:
  - ru
  - en
script_template: inno_setup.sas
